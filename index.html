<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BB Systems is an AI-first software company developing focused web applications, add-ons, and developer tools through agent-supported operations.">
  <meta name="theme-color" content="#141210">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="index, follow">
  <title>BB Systems</title>
  <link rel="canonical" href="https://bbsystems.dev/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/urbanist-latin-600-700.woff2" as="font" type="font/woff2" crossorigin>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BB Systems">
  <meta property="og:title" content="BB Systems">
  <meta property="og:description" content="An AI-first software company developing focused web applications, add-ons, and developer tools through agent-supported operations.">
  <meta property="og:url" content="https://bbsystems.dev/">
  <meta property="og:image" content="https://bbsystems.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BB Systems — software backed by agents and evidence">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BB Systems">
  <meta name="twitter:description" content="An AI-first software company developing focused web applications, add-ons, and developer tools through agent-supported operations.">
  <meta name="twitter:image" content="https://bbsystems.dev/og-image.png">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BB Systems",
      "url": "https://bbsystems.dev/",
      "description": "An AI-first software company developing focused web applications, add-ons, and developer tools through agent-supported operations."
    }
  </script>

  <style>
    @font-face {
      font-family: "Urbanist";
      font-style: normal;
      font-weight: 600 700;
      font-display: swap;
      src: url("./assets/fonts/urbanist-latin-600-700.woff2") format("woff2");
    }

    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("./assets/fonts/barlow-latin-400.woff2") format("woff2");
    }

    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("./assets/fonts/jetbrains-mono-latin-500.woff2") format("woff2");
    }

    :root {
      --bg: #141210;
      --bg-raised: #1c1917;
      --rule: #2a2624;
      --text: #f2ede7;
      --text-muted: #a8a099;
      --accent: #d4703f;
      --signal-rgb: 79, 212, 217;
      --font-display: "Urbanist", system-ui, sans-serif;
      --font-body: "Barlow", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --gutter: clamp(1.25rem, 5vw, 2.5rem);
      --content: 45rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-width: 20rem;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.008), rgba(255, 255, 255, 0.008)),
        var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1.125rem;
      font-weight: 400;
      line-height: 1.6;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    a {
      color: inherit;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.22em;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
    }

    .skip-link {
      position: fixed;
      z-index: 10;
      top: 1rem;
      left: 1rem;
      padding: 0.65rem 0.9rem;
      transform: translateY(-200%);
      border: 1px solid var(--accent);
      background: var(--bg-raised);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .skip-link:focus,
    .skip-link:focus-visible {
      transform: translateY(0);
    }

    .shell {
      width: min(calc(100% - (2 * var(--gutter))), var(--content));
      margin-inline: auto;
    }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      border-bottom: 1px solid var(--rule);
    }

    .hero::before,
    .hero::after {
      position: absolute;
      pointer-events: none;
      content: "";
    }

    .hero::before {
      z-index: -4;
      inset: 0;
      background:
        radial-gradient(circle at 80% 24%, rgba(212, 112, 63, 0.1), transparent 27rem),
        linear-gradient(180deg, #171411 0%, var(--bg) 72%);
    }

    .hero::after {
      z-index: -3;
      inset: 48% -30% -28%;
      opacity: 0.7;
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(var(--signal-rgb), 0.17) 0,
          rgba(var(--signal-rgb), 0.17) 1px,
          transparent 1px,
          transparent 4.5rem
        ),
        repeating-linear-gradient(
          0deg,
          rgba(var(--signal-rgb), 0.13) 0,
          rgba(var(--signal-rgb), 0.13) 1px,
          transparent 1px,
          transparent 3.5rem
        );
      transform: perspective(30rem) rotateX(63deg) translate3d(0, -3.5rem, 0);
      transform-origin: center top;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 58%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 58%, transparent 100%);
      animation: grid-drift 28s linear infinite;
    }

    .horizon {
      position: absolute;
      z-index: -2;
      top: 51%;
      left: 50%;
      width: min(78rem, 130vw);
      height: 1px;
      translate: -50% 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(var(--signal-rgb), 0.04) 12%,
        rgba(var(--signal-rgb), 0.24) 50%,
        rgba(var(--signal-rgb), 0.04) 88%,
        transparent
      );
    }

    @keyframes grid-drift {
      from {
        transform: perspective(30rem) rotateX(63deg) translate3d(0, -3.5rem, 0);
      }
      to {
        transform: perspective(30rem) rotateX(63deg) translate3d(0, 0, 0);
      }
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100svh;
      padding-block: clamp(1.5rem, 5vw, 2.5rem) clamp(1.25rem, 4vw, 2rem);
    }

    .hero-rail,
    .footer-rail,
    .status {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .hero-rail {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .hero-rail::before {
      width: 2.75rem;
      height: 0.3rem;
      flex: 0 0 auto;
      background: var(--accent);
      content: "";
    }

    .hero-rail span:first-of-type {
      margin-right: auto;
    }

    .hero-copy {
      padding-block: clamp(4rem, 12vh, 8rem);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: clamp(2rem, 5vw, 3rem);
      color: var(--text);
      font-family: var(--font-display);
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.19em;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
    }

    .wordmark-mark {
      display: grid;
      width: 0.75rem;
      gap: 0.18rem;
    }

    .wordmark-mark::before,
    .wordmark-mark::after {
      display: block;
      height: 2px;
      background: var(--accent);
      content: "";
    }

    .wordmark-mark::after {
      width: 55%;
      margin-left: auto;
    }

    h1,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 10ch;
      margin-bottom: clamp(1.5rem, 3vw, 2rem);
      font-family: var(--font-display);
      font-size: clamp(4rem, 13vw, 7.75rem);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 0.88;
      text-wrap: balance;
    }

    .hero-description {
      max-width: 35rem;
      margin-bottom: clamp(2rem, 5vw, 3.5rem);
      color: var(--text-muted);
      font-size: clamp(1.2rem, 2.4vw, 1.45rem);
      line-height: 1.55;
      text-wrap: pretty;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      min-height: 1.5rem;
    }

    .status::before {
      width: 0.45rem;
      height: 0.45rem;
      flex: 0 0 auto;
      border: 1px solid var(--accent);
      background: linear-gradient(90deg, var(--accent) 50%, transparent 50%);
      content: "";
    }

    .footer-rail {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
    }

    @media (max-width: 36rem) {
      .hero-rail,
      .footer-rail {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.75rem;
      }

      .hero-rail span:first-of-type {
        margin-right: 0;
      }

      .hero-copy {
        padding-block: 3.5rem;
      }

      h1 {
        font-size: clamp(3.6rem, 19vw, 6rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .hero::after {
        animation: none;
        transform: perspective(30rem) rotateX(63deg) translate3d(0, 0, 0);
      }
    }

    @media (forced-colors: active) {
      .hero::before,
      .hero::after,
      .horizon {
        display: none;
      }

      .hero,
      .footer-rail {
        border-color: CanvasText;
      }

      .wordmark-mark::before,
      .wordmark-mark::after,
      .hero-rail::before,
      .status::before {
        background: CanvasText;
        border-color: CanvasText;
      }

      a:focus-visible {
        outline-color: Highlight;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content" class="hero">
    <div class="horizon" aria-hidden="true"></div>
    <div class="shell hero-content">
      <div class="hero-rail" aria-label="BB Systems signal">
        <span>Signal / Studio</span>
        <span>2026</span>
      </div>

      <div class="hero-copy">
        <a class="wordmark" href="#main-content" aria-label="BB Systems home">
          <span class="wordmark-mark" aria-hidden="true"></span>
          <span>BB Systems</span>
        </a>
        <h1>Coming soon</h1>
        <p class="hero-description">An AI-first software company developing focused web applications, add-ons, and developer tools through agent-supported operations.</p>
        <span class="status" role="status">IN BUILD</span>
      </div>

      <footer class="footer-rail">
        <span>© 2026 BB Systems</span>
        <span>Built with intent</span>
      </footer>
    </div>
  </main>
</body>
</html>
